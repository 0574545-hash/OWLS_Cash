<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OWLS Cash</title>
<meta name="description" content="Учёт личных расходов: сегодня, история, дашборд.">
<meta name="theme-color" content="#F0E9DC">
<meta name="color-scheme" content="light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OWLS Cash">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="preload" href="fonts/unbounded-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/manrope-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/owls.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <main id="screens" class="screens"></main>
  <nav class="tabbar" id="tabbar" aria-label="Разделы">
    <button type="button" class="tab on" data-tab="today" aria-current="page">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      <span>Сегодня</span>
    </button>
    <button type="button" class="tab" data-tab="history" aria-current="false">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <span>История</span>
    </button>
    <button type="button" class="tab" data-tab="dash" aria-current="false">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18M7 16v-4M12 16V8M17 16v-6"/></svg>
      <span>Дашборд</span>
    </button>
  </nav>
  <div id="overlay"></div>
  <div id="sheet"></div>
</div>
<div id="splash" hidden>
  <div class="s-ph s-ph1"><span class="s-eyebrow">Про деньги</span><div class="s-slot" id="splash-line"></div></div>
  <div class="s-ph s-ph2"><div class="s-owl"><img src="assets/owls_owl.png" alt=""></div><span class="s-wm"><b>OWLS</b><em>CASH</em></span></div>
</div>
<script src="js/icons.js"></script>
<script src="js/owls-motion.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
